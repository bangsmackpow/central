name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Weekly scan on Mondays

jobs:
  sca-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Fail on vulnerabilities
          severity: 'CRITICAL,HIGH'

  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for Gitleaks to scan history

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
          generateSarif: "1"

  cloudflare-audit:
    name: Cloudflare Configuration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit wrangler.toml
        run: |
          # Check for sensitive keywords in [vars] or other sections that shouldn't be hardcoded
          # Specifically looking for MASTER_ENCRYPTION_KEY as mentioned in project docs
          if grep -iE "key|secret|password|token|auth|encryption" wrangler.toml | grep -v "#"; then
            echo "Error: Potential secrets or sensitive keys found hardcoded in wrangler.toml!"
            echo "Please use GitHub Secrets and environment variables instead of hardcoding in [vars]."
            exit 1
          fi
          
          # Verify nodejs_compat is present as required by the app
          if ! grep -q "nodejs_compat" wrangler.toml; then
            echo "Warning: nodejs_compat flag missing in wrangler.toml, which is required for Hono/Better-Auth."
          fi
          
          echo "wrangler.toml audit passed."
